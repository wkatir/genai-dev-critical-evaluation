[project]
name = "txnorm"
version = "1.0.0"
description = "Multi-source transaction normalization, validation and interactive exploration"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Wilmer Salazar", email = "wilmerhenrysalazarmartinez@gmail.com" }]
dependencies = ["rich>=13.7", "tzdata>=2024.1"]

[project.scripts]
txnorm = "txnorm.interface.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/txnorm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
